<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Tree Finance School</title>
<meta name="description" content="Aprenda a investir com segurança. Fale com a Tree Finance School.">
<meta name="theme-color" content="#ffffff">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Figtree:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
:root{--navy:#0b2545;--blue:#1b4f9c;--green:#1e9e63;--tint:#eef4fb;--muted:#51627a;--line:#d6e2f1}
*{box-sizing:border-box;margin:0}
html,body{min-height:100%}
body{font-family:Figtree,system-ui,-apple-system,"Segoe UI",sans-serif;color:var(--navy);background:linear-gradient(180deg,#fff 0%,#fff 45%,var(--tint) 100%) fixed;display:flex;justify-content:center;overflow-x:hidden;-webkit-font-smoothing:antialiased}
.bg{position:fixed;left:0;right:0;bottom:0;height:62vh;min-height:320px;pointer-events:none}
.bg svg{width:100%;height:100%;display:block}
.grid line{stroke:var(--blue);stroke-opacity:.09;stroke-width:1}
.far{fill:none;stroke:var(--blue);stroke-opacity:.22;stroke-width:1.6;stroke-linecap:round;stroke-linejoin:round;stroke-dasharray:1;stroke-dashoffset:1}
.main{fill:none;stroke:var(--green);stroke-width:3;stroke-linecap:round;stroke-linejoin:round;stroke-dasharray:1;stroke-dashoffset:1}
.area{fill:url(#ag);opacity:0}
.dot{fill:var(--green);opacity:0}
.halo{fill:var(--green);opacity:0;transform-box:fill-box;transform-origin:center}
.bars rect{fill:var(--blue);opacity:0;transform-box:fill-box;transform-origin:bottom;transform:scaleY(.2)}
.ready .far{animation:draw 14s cubic-bezier(.4,0,.2,1) infinite}
.ready .main{animation:draw 14s cubic-bezier(.4,0,.2,1) infinite .5s}
.ready .area{animation:fade 14s ease infinite .5s}
.ready .dot{animation:dot 14s ease infinite .5s}
.ready .halo{animation:halo 14s ease-out infinite .5s}
.ready .bars rect{animation:bar 14s ease infinite}
.bars rect:nth-child(2){animation-delay:.3s!important}.bars rect:nth-child(3){animation-delay:.6s!important}.bars rect:nth-child(4){animation-delay:.9s!important}.bars rect:nth-child(5){animation-delay:1.2s!important}.bars rect:nth-child(6){animation-delay:1.5s!important}
@keyframes draw{0%{stroke-dashoffset:1;opacity:1}50%{stroke-dashoffset:0;opacity:1}88%{stroke-dashoffset:0;opacity:1}100%{stroke-dashoffset:0;opacity:0}}
@keyframes fade{0%,20%{opacity:0}50%,88%{opacity:1}100%{opacity:0}}
@keyframes dot{0%,46%{opacity:0}52%,88%{opacity:1}100%{opacity:0}}
@keyframes halo{0%,50%{opacity:0;transform:scale(1)}56%{opacity:.35}74%{opacity:0;transform:scale(4)}100%{opacity:0}}
@keyframes bar{0%{opacity:0;transform:scaleY(.2)}30%,88%{opacity:.14;transform:scaleY(1)}100%{opacity:0;transform:scaleY(1)}}
.wrap{position:relative;width:100%;max-width:460px;padding:calc(30px + env(safe-area-inset-top,0px)) 24px calc(32px + env(safe-area-inset-bottom,0px));display:flex;flex-direction:column;align-items:center;text-align:center}
.logo{width:140px;height:auto;mix-blend-mode:multiply}
h1{font-size:clamp(29px,8vw,36px);line-height:1.1;font-weight:700;letter-spacing:-.025em;margin-top:16px}
p.sub{color:var(--muted);font-size:17px;line-height:1.55;margin-top:12px;max-width:34ch}
.chips{display:flex;flex-wrap:wrap;justify-content:center;gap:8px;margin-top:18px}
.chips span{display:inline-flex;align-items:center;gap:7px;padding:8px 13px;border:1px solid var(--line);background:rgba(255,255,255,.85);border-radius:999px;font-size:14px;font-weight:600;color:var(--navy)}
.chips svg{width:16px;height:16px;color:var(--green)}
.btns{width:100%;display:flex;flex-direction:column;gap:12px;margin-top:28px}
.btn{display:flex;align-items:center;justify-content:center;gap:12px;min-height:58px;border-radius:16px;font:600 17px/1 Figtree,system-ui,sans-serif;text-decoration:none;transition:transform .18s ease,box-shadow .18s ease,background .18s ease}
.btn svg{width:22px;height:22px;flex:none}
.wa{background:var(--navy);color:#fff}
.ig{background:rgba(255,255,255,.9);color:var(--navy);border:1.5px solid var(--navy)}
.btn:hover{transform:translateY(-2px)}
.wa:hover{background:var(--green);box-shadow:0 10px 24px rgba(30,158,99,.3)}
.ig:hover{background:var(--tint)}
.btn:focus-visible{outline:3px solid var(--blue);outline-offset:3px}
.btn:active{transform:scale(.98)}
.foot{margin-top:26px;font-size:14px;color:var(--muted)}
.logo,h1,p.sub,.chips,.btn,.foot{opacity:0;transform:translateY(14px);transition:opacity .7s ease,transform .7s cubic-bezier(.2,.7,.2,1)}
.ready .logo,.ready h1,.ready p.sub,.ready .chips,.ready .btn,.ready .foot{opacity:1;transform:none}
.ready h1{transition-delay:.2s}.ready p.sub{transition-delay:.33s}.ready .chips{transition-delay:.46s}.ready .wa{transition-delay:.6s}.ready .ig{transition-delay:.72s}.ready .foot{transition-delay:.88s}
.ready .btn:hover{transition-delay:0s}
@media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}.far,.main{stroke-dashoffset:0}.area{opacity:1}.dot{opacity:1}.bars rect{opacity:.14;transform:none}}
</style>
</head>
